<!DOCTYPE html>
<html>

<head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/bowmasters/">
    <title>Bowmasters</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="msapplication-tap-highlight" content="no"/>
    <meta name="MobileOptimized" content="960"/>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui"/>
    <meta charset="utf-8"/>

    <link rel="stylesheet" type="text/css" href="style/index.css" nonce="nDK4DWRLJoqf7mjw9cLs1g"/>

    <script nonce="nDK4DWRLJoqf7mjw9cLs1g">
if (!window.ytgame) {
  window.ytgame = {
    SDK_VERSION: "standalone",
    IN_PLAYABLES_ENV: false,
    SdkError: function (t) { this.errorType = t; this.message = ""; },
    SdkErrorType: { UNDEFINED: 0, GAMEAPI_UNDEFINED: 1 },
    game: {
      firstFrameReady: function () {},
      gameReady: function () {},
      loadData: function () { return Promise.resolve(localStorage.getItem("bowmasters-save") || ""); },
      saveData: function (data) { localStorage.setItem("bowmasters-save", data); return Promise.resolve(); }
    },
    engagement: { sendScore: function () { return Promise.resolve(); } },
    ads: {
      requestAd: function () { return Promise.resolve(3); },
      requestInterstitialAd: function () { return Promise.resolve(); },
      AdResult: { UNKNOWN: 0, SHOWED: 1, REJECTED: 3, DISMISSED: 2 }
    },
    health: { logError: function () {}, logWarning: function () {} },
    system: {
      getLanguage: function () { return Promise.resolve("en"); },
      isAudioEnabled: function () { return true; },
      onAudioEnabledChange: function () { return function () {}; },
      onPause: function () { return function () {}; },
      onResume: function () { return function () {}; }
    }
  };
  window.ytgamehelper = { myConsoleLog: function () {} };
}
</script>
<script src="game.js" nonce="nDK4DWRLJoqf7mjw9cLs1g"></script>
<script nonce="nDK4DWRLJoqf7mjw9cLs1g">window.addEventListener("load", () => window.runGame());</script>
</head>


<body>
    <div id="game"></div>
</body>
</html>

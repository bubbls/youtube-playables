<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/archery-world-tour/">
    <title>Archery World Tour</title>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="initial-scale=1.0,maximum-scale=1.01, minimal-ui"
    />
    <style>
      body {
        margin: 0px;
        padding: 0px;
        width: 100%;
        overflow: hidden;
        background-color: black;
      }

      canvas {
        -ms-touch-action: none;
        image-rendering: -o-crisp-edges;
        image-rendering: optimize-contrast;
        -ms-interpolation-mode: nearest-neighbor;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        -moz-tap-highlight-color: rgba(0, 0, 0, 0);
        tap-highlight-color: rgba(0, 0, 0, 0);
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
    </style>

    <script nonce="XZH99PFHGq76b3KDl_GsLw">
if (!window.ytgame) {
  window.ytgame = {
    SDK_VERSION: "standalone",
    IN_PLAYABLES_ENV: false,
    SdkError: function (t) { this.errorType = t; this.message = ""; },
    SdkErrorType: { UNDEFINED: 0, GAMEAPI_UNDEFINED: 1 },
    game: {
      firstFrameReady: function () {},
      gameReady: function () {},
      loadData: function () { return Promise.resolve(localStorage.getItem("archery-world-tour-save") || ""); },
      saveData: function (data) { localStorage.setItem("archery-world-tour-save", data); return Promise.resolve(); }
    },
    engagement: { sendScore: function () { return Promise.resolve(); } },
    ads: {
      requestAd: function () { return Promise.resolve(3); },
      requestInterstitialAd: function () { return Promise.resolve(); },
      AdResult: { UNKNOWN: 0, SHOWED: 1, REJECTED: 3, DISMISSED: 2 }
    },
    health: { logError: function () {}, logWarning: function () {} },
    system: {
      getLanguage: function () { return Promise.resolve("en"); },
      isAudioEnabled: function () { return true; },
      onAudioEnabledChange: function () { return function () {}; },
      onPause: function () { return function () {}; },
      onResume: function () { return function () {}; }
    }
  };
  window.ytgamehelper = { myConsoleLog: function () {} };
}
</script>
    <script nonce="XZH99PFHGq76b3KDl_GsLw">
      ytgame.game.firstFrameReady();
    </script>

    <script nonce="XZH99PFHGq76b3KDl_GsLw">
      window.famobi_gameID = "archery-world-tour";
      window.famobi_gameJS = [
        "TweenMax.min.js",
        "Howler.min.js",
        "VisibilityManager.js",
        "app.js",
        function () {
          fenster.subscribeToOffsetUpdates(() => {
            window.onresize();
            // hier die resize Methode aufrufen
          });

          if (!window.famobi.hasFeature("leaderboard")) {
            extGameLoad();
            return;
          }

          var apiURL = "//tools.famobi.com/api/simple-highscore/api.js";
          if (document.location.href.indexOf("file:") !== -1)
            apiURL = "http:" + apiURL;

          faZepto.getScript(apiURL, extGameLoad, function () {
            window.famobi.config.features.leaderboard = 0;
            extGameLoad();
          });
        },
      ];
      (function (document, url, fgJS, firstJS) {
        fgJS = document.createElement("script");
        firstJS = document.getElementsByTagName("script")[0];
        fgJS.src = url + "";
        firstJS.parentNode.insertBefore(fgJS, firstJS);
      })(document, "html5games/gameapi/v1.js");
    </script>
  </head>

  <body>
    <div
      id="canvas-wrapper"
      style="
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        position: absolute;
      "
    >
      <canvas id="canvas" moz-opaque></canvas>
    </div>
  </body>
</html>

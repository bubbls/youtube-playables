<!DOCTYPE html>
<html lang="en-us">

<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/aquapark-io/">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>YT Game Wrapper WebGL Template</title>
  <link rel="stylesheet" href="TemplateData/style.css" nonce="gAKBBT4aLfaZvJiS8jIdUw">
  <script nonce="gAKBBT4aLfaZvJiS8jIdUw">
if (!window.ytgame) {
  window.ytgame = {
    SDK_VERSION: "standalone",
    IN_PLAYABLES_ENV: false,
    SdkError: function (t) { this.errorType = t; this.message = ""; },
    SdkErrorType: { UNDEFINED: 0, GAMEAPI_UNDEFINED: 1 },
    game: {
      firstFrameReady: function () {},
      gameReady: function () {},
      loadData: function () { return Promise.resolve(localStorage.getItem("aquapark-io-save") || ""); },
      saveData: function (data) { localStorage.setItem("aquapark-io-save", data); return Promise.resolve(); }
    },
    engagement: { sendScore: function () { return Promise.resolve(); } },
    ads: {
      requestAd: function () { return Promise.resolve(3); },
      requestInterstitialAd: function () { return Promise.resolve(); },
      AdResult: { UNKNOWN: 0, SHOWED: 1, REJECTED: 3, DISMISSED: 2 }
    },
    health: { logError: function () {}, logWarning: function () {} },
    system: {
      getLanguage: function () { return Promise.resolve("en"); },
      isAudioEnabled: function () { return true; },
      onAudioEnabledChange: function () { return function () {}; },
      onPause: function () { return function () {}; },
      onResume: function () { return function () {}; }
    }
  };
  window.ytgamehelper = { myConsoleLog: function () {} };
}
</script>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
    <div id="unity-loading-bar" class="unity-preload-1">
      <div id="filler"></div>
      <div id="playBtn" class="btnAppear"></div>
      <div id="carroutxt"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script src="unarchiver.min.js" nonce="gAKBBT4aLfaZvJiS8jIdUw">// used for decompression if zip files are used</script>
  <script src="main.js" nonce="gAKBBT4aLfaZvJiS8jIdUw"> // Logic for Unity contianer</script>
</body>
</html>
